<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Redes - Shibboleth</title>

    <!-- Librería para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            /* Configuración de la imagen de fondo */
            background-image: url('Fondo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            /* Oscurece un poco la imagen para que resalten las letras neón */
            background-color: rgba(0, 0, 0, 0.6);
            background-blend-mode: darken;

            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .profile-img {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        h1 { 
            font-size: 1.4rem; 
            margin: 0 0 10px 0; 
            letter-spacing: 1px;
        }

        /* --- BOTÓN DESTACADO DE CORREO DE CONTACTO --- */
        .email-contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.3), rgba(0, 212, 255, 0.3));
            border: 1px solid rgba(0, 212, 255, 0.6);
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
            backdrop-filter: blur(5px);
        }

        .email-contact-btn:hover {
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.6), rgba(0, 212, 255, 0.6));
            box-shadow: 0 0 18px rgba(0, 212, 255, 0.6);
            transform: translateY(-2px);
            color: #ffffff;
        }

        /* --- DESCRIPCIÓN DE CONTENIDO --- */
        .bio-description {
            max-width: 380px;
            text-align: center;
            font-size: 0.9rem;
            line-height: 1.4;
            color: #dddddd;
            margin-bottom: 25px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        .links-container { 
            width: 100%; 
            max-width: 350px; 
        }
        
        /* Estilo base de los botones */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(31, 31, 31, 0.85);
            text-align: center;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #333;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }
        .link-btn:hover { 
            background: rgba(51, 51, 51, 0.95); 
            transform: translateY(-2px);
        }

        /* --- COLORES NEÓN PERSONALIZADOS --- */
        
        /* TikTok: Blanco Neón */
        .btn-tk {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 15px rgba(255, 255, 255, 0.5);
        }

        /* YouTube: Rojo Neón */
        .btn-yt {
            color: #ff0055;
            text-shadow: 0 0 5px rgba(255, 0, 85, 0.6);
        }

        /* Instagram: Amarillo Neón */
        .btn-ig {
            color: #ffee00;
            text-shadow: 0 0 5px rgba(255, 238, 0, 0.6);
        }

        /* Facebook: Azul Neón */
        .btn-fb {
            color: #00d2ff;
            text-shadow: 0 0 5px rgba(0, 210, 255, 0.6);
        }
    </style>
</head>
<body>

    <img src="perfil.jpg" class="profile-img" alt="Foto de perfil">
    <h1>Shibboleth</h1>

    <!-- Botón directo para contacto por correo -->
    <a href="mailto:shibboleth4lbin4@gmail.com" class="email-contact-btn">
        <i class="fa-solid fa-envelope"></i> shibboleth4lbin4@gmail.com
    </a>

    <!-- Descripción del canal -->
    <p class="bio-description">
        Desastres naturales, misterios sin resolver y fenómenos que escapan a nuestro entendimiento.
    </p>

    <div class="links-container">
        <!-- TikTok -->
        <a href="https://www.tiktok.com/@shibboleth117" target="_blank" rel="noopener noreferrer" class="link-btn btn-tk">
            <i class="fa-brands fa-tiktok"></i> TikTok
        </a>

        <!-- YouTube -->
        <a href="https://www.youtube.com/@Shibboleth-117" target="_blank" rel="noopener noreferrer" class="link-btn btn-yt">
            <i class="fa-brands fa-youtube"></i> YouTube
        </a>

        <!-- Instagram -->
        <a href="https://www.instagram.com/shibboleethh?igsh=MTRwbGFrdXVpbDljMw==&igsi=MTRwbGFrdXVpbDljMw=" target="_blank" rel="noopener noreferrer" class="link-btn btn-ig">
            <i class="fa-brands fa-instagram"></i> Instagram
        </a>

        <!-- Facebook -->
        <a href="https://www.facebook.com/share/14rNfuQdwzy/" target="_blank" rel="noopener noreferrer" class="link-btn btn-fb">
            <i class="fa-brands fa-facebook"></i> Facebook
        </a>
    </div>

</body>
</html>
