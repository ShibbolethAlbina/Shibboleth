<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Redes</title>

    <!-- Librería para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            /* Configuración de la imagen de fondo */
            background-image: url('Fondo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            /* Oscurece un poco la imagen para que resalten las letras neón */
            background-color: rgba(0, 0, 0, 0.6);
            background-blend-mode: darken;

            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2); /* Borde sutil para resaltar del fondo */
        }

        h1 { font-size: 1.2rem; margin-bottom: 20px; }
        .links-container { width: 100%; max-width: 350px; }
        
        /* Estilo base de los botones */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(31, 31, 31, 0.85); /* Fondo semitransparente para ver el fondo */
            text-align: center;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #333;
            transition: 0.2s;
            backdrop-filter: blur(4px); /* Efecto cristal borroso */
        }
        .link-btn:hover { background: rgba(51, 51, 51, 0.95); }

        /* --- COLORES NEÓN PERSONALIZADOS --- */
        
        /* YouTube: Rojo Neón */
        .btn-yt {
            color: #ff0055;
            text-shadow: 0 0 5px rgba(255, 0, 85, 0.6);
        }

        /* Instagram: Amarillo Neón */
        .btn-ig {
            color: #ffee00;
            text-shadow: 0 0 5px rgba(255, 238, 0, 0.6);
        }

        /* Facebook: Azul Neón */
        .btn-fb {
            color: #00d2ff;
            text-shadow: 0 0 5px rgba(0, 210, 255, 0.6);
        }
    </style>
</head>
<body>

<img src="Perfil.jpg" class="profile-img" alt="Foto de perfil">
<h1>Shibboleth</h1>

    <div class="links-container">
        <a href="https://www.youtube.com/@Shibboleth-117" target="_blank" class="link-btn btn-yt">
            <i class="fa-brands fa-youtube"></i> YouTube
        </a>
        <a href="https://www.instagram.com/shibboleethh?igsh=MTRwbGFrdXVpbDljMw==&igsi=MTRwbGFrdXVpbDljMw=" target="_blank" class="link-btn btn-ig">
            <i class="fa-brands fa-instagram"></i> Instagram
        </a>
        <a href="https://www.facebook.com/share/14rNfuQdwzy/" target="_blank" class="link-btn btn-fb">
            <i class="fa-brands fa-facebook"></i> Facebook
        </a>
    </div>

</body>
</html>
